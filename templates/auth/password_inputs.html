{# Ikki bosqichli formada parollar qayta to'ldiriladi — foydalanuvchi ularni kod kelgach qayta yozmasin #}
<div>
  <label for="f-password" class="label">{{ label1 }}</label>
  <input id="f-password" name="password" type="password" class="input" maxlength="8" placeholder="Parolni kiriting" autocomplete="new-password" value="{{ state.values.password|default:'' }}"{% if state.errors.password %} aria-invalid="true" aria-describedby="f-password-error"{% elif hint1 %} aria-describedby="f-password-hint"{% endif %}>
  {% if state.errors.password %}<p id="f-password-error" class="field-error" role="alert">{{ state.errors.password }}</p>{% elif hint1 %}<p id="f-password-hint" class="hint">{{ hint1 }}</p>{% endif %}
</div>
<div>
  <label for="f-password2" class="label">{{ label2 }}</label>
  <input id="f-password2" name="passwordConfirm" type="password" class="input" maxlength="8" placeholder="Parolni takrorlang" autocomplete="new-password" value="{{ state.values.passwordConfirm|default:'' }}"{% if state.errors.passwordConfirm %} aria-invalid="true" aria-describedby="f-password2-error"{% endif %}>
  {% if state.errors.passwordConfirm %}<p id="f-password2-error" class="field-error" role="alert">{{ state.errors.passwordConfirm }}</p>{% endif %}
</div>
