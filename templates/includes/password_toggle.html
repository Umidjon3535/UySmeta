{# Parolni ko'rsatish/yashirish tugmasi — input bilan birga .relative ichida turadi (app.js: data-password-toggle) #}
<button type="button" class="absolute inset-y-0 right-0 grid w-11 place-items-center text-muted hover:text-fg" data-password-toggle aria-label="Parolni ko'rsatish" aria-pressed="false">
  <span data-eye="show">{% icon "eye" 18 %}</span><span data-eye="hide" hidden>{% icon "eye-off" 18 %}</span>
</button>
